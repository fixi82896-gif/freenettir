name: Proxy pipeline checks

on:
  pull_request:
    paths:
      - 'main.py'
      - 'proxy_utils.py'
      - 'test_proxy_utils.py'
      - 'test_proxy_pipeline.py'
      - 'proxy_health.py'
      - 'test_proxy_health.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/proxy-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot dependency for isolated tests
        run: python -m pip install requests "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git@80224c93c47242575107c83eb603d675e49226e8"
      - name: Compile bot and proxy helper (no bot execution)
        run: python -m py_compile main.py proxy_utils.py proxy_health.py
      - name: Test proxy extraction (no Telegram messages)
        run: python -m unittest -v test_proxy_utils test_proxy_pipeline test_proxy_health

name: Source health audit (read only)

on:
  pull_request:
    paths:
      - 'diagnose_hardcoded_sources.py'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible verification tools
        run: python -m pip install requests "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git@80224c93c47242575107c83eb603d675e49226e8"
      - name: Audit 15 sources; no posts or secrets
        run: python -u diagnose_hardcoded_sources.py

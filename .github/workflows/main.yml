name: Telegram Config Bot Runner

on:
  schedule:
    # اجرا هر ۵ ساعت یک‌بار (برای زنده نگه داشتن مداوم ربات)
    - cron: '0 */5 * * *'
  workflow_dispatch: # امکان اجرای دستی از لبه Actions

# مجوز دسترسی نوشتن به GITHUB_TOKEN جهت آپدیت فایل JSON تاریخچه
permissions:
  contents: write

# جلوگیری از اجرای هم‌زمان دو ورک‌فلو و ایجاد تداخل
concurrency:
  group: telegram-bot-group
  cancel-in-progress: true

jobs:
  run-telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # حداکثر زمان اجرای یک اکشن (کمی کمتر از ۶ ساعت محدودیت گیت‌هاب)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          AD_BUTTON_TEXT: ${{ secrets.AD_BUTTON_TEXT }}
          AD_BUTTON_URL: ${{ secrets.AD_BUTTON_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
